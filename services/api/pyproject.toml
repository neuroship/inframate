[project]
name = "inframate"
version = "0.2.25"
description = "An all-in-one local interface for navigating, operating, and understanding your Terraform infrastructure"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
authors = [{ name = "Amin Dorostanian" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-hcl2>=5.0",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "aioboto3>=15.5.0",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "textual>=8.2.3",
]

[project.urls]
Homepage = "https://github.com/neuroship/inframate"
Repository = "https://github.com/neuroship/inframate"

[project.scripts]
inframate = "app.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"app" = ["static/**/*"]

[tool.black]
line-length = 88
