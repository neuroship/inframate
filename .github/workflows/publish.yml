name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for example: v0.2.8)"
        required: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build UI
        working-directory: services/ui
        run: |
          npm ci
          npm run build

      - name: Build Python package
        working-directory: services/api
        run: |
          cp ../../README.md .
          uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: services/api/dist/

  build-binaries:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build UI
        working-directory: services/ui
        run: |
          npm ci
          npm run build

      - name: Build standalone binary
        working-directory: services/api
        run: |
          cp ../../README.md .
          uv sync
          uv run --with pyinstaller python -m PyInstaller --onefile --name inframate --collect-data app app/cli.py

      - name: Package binary
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p release
          cp services/api/dist/inframate release/
          ASSET_NAME="inframate-${VERSION}-macos-${ARCH}.tar.gz"
          tar -C release -czf "$ASSET_NAME" inframate
          shasum -a 256 "$ASSET_NAME" > "$ASSET_NAME.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: |
            inframate-${{ env.RELEASE_TAG }}-macos-${{ matrix.arch }}.tar.gz
            inframate-${{ env.RELEASE_TAG }}-macos-${{ matrix.arch }}.tar.gz.sha256

  upload-release-assets:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256

  update-homebrew:
    needs: [publish, upload-release-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Compute formula metadata
        id: meta
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          ARM_FILE="inframate-${VERSION}-macos-arm64.tar.gz"
          ARM_SHA=$(awk '{print $1}' "release-assets/${ARM_FILE}.sha256")
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "arm_url=https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ARM_FILE}" >> $GITHUB_OUTPUT
          echo "arm_sha=${ARM_SHA}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          repository: neuroship/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Generate formula
        run: |
          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/inframate.rb << ENDFORMULA
          class Inframate < Formula
            desc "CLI tool for managing Terraform infrastructure with a local web UI"
            homepage "https://github.com/neuroship/inframate"
            license "AGPL-3.0-only"

            version "${{ steps.meta.outputs.version }}"
            url "${{ steps.meta.outputs.arm_url }}"
            sha256 "${{ steps.meta.outputs.arm_sha }}"

            depends_on arch: :arm64

            def install
              bin.install "inframate"
            end

            test do
              assert_match "inframate", shell_output("#{bin}/inframate --help")
            end
          end
          ENDFORMULA

      - name: Push to tap
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/inframate.rb
          git commit -m "inframate ${{ steps.meta.outputs.version }}"
          git push
