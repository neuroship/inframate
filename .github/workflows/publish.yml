name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build UI
        working-directory: services/ui
        run: |
          npm ci
          npm run build

      - name: Build Python package
        working-directory: services/api
        run: |
          cp ../../README.md .
          uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: services/api/dist/

  update-homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Get version from pyproject.toml
        id: meta
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('services/api/pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get SHA from PyPI
        id: pypi
        run: |
          VERSION=${{ steps.meta.outputs.version }}
          for i in $(seq 1 30); do
            RESPONSE=$(curl -sf "https://pypi.org/pypi/inframate/${VERSION}/json") && break
            echo "Waiting for PyPI... (attempt $i)"
            sleep 10
          done
          URL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print([u['url'] for u in d['urls'] if u['packagetype']=='sdist'][0])")
          SHA=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print([u['digests']['sha256'] for u in d['urls'] if u['packagetype']=='sdist'][0])")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Generate resource blocks
        run: |
          pip install ${{ steps.pypi.outputs.url }}
          python3 << 'PYSCRIPT' > /tmp/resources.txt
          import importlib.metadata, json, urllib.request

          SKIP = {"inframate", "pip", "setuptools", "wheel"}
          # Rust/maturin packages — installed as wheels in the formula
          RUST_PKGS = {"jiter", "pydantic-core", "pydantic_core", "watchfiles"}
          seen = set()
          rust_pins = []

          for dist in sorted(importlib.metadata.distributions(), key=lambda d: d.metadata["Name"].lower()):
              name = dist.metadata["Name"]
              lower = name.lower()
              version = dist.metadata["Version"]
              if lower in SKIP or lower in seen:
                  continue
              seen.add(lower)
              if lower in RUST_PKGS or lower.replace("-", "_") in RUST_PKGS:
                  rust_pins.append(f"{name}=={version}")
                  continue
              url = f"https://pypi.org/pypi/{name}/{version}/json"
              with urllib.request.urlopen(url) as resp:
                  data = json.loads(resp.read())
              sdist = next((u for u in data["urls"] if u["packagetype"] == "sdist"), None)
              if sdist:
                  print(f'resource "{name}" do')
                  print(f'  url "{sdist["url"]}"')
                  print(f'  sha256 "{sdist["digests"]["sha256"]}"')
                  print(f'end')
                  print()

          # Write Rust package pins as Ruby arguments for the formula
          with open("/tmp/rust_pins_rb.txt", "w") as f:
              f.write(", ".join(f'"{p}"' for p in rust_pins))
          PYSCRIPT

      - uses: actions/checkout@v4
        with:
          repository: neuroship/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Generate formula
        env:
          TARBALL_URL: ${{ steps.pypi.outputs.url }}
          TARBALL_SHA: ${{ steps.pypi.outputs.sha256 }}
        run: |
          RUST_PINS_RB=$(cat /tmp/rust_pins_rb.txt)
          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/inframate.rb << ENDFORMULA
          class Inframate < Formula
            include Language::Python::Virtualenv

            desc "CLI tool for managing Terraform infrastructure with a local web UI"
            homepage "https://github.com/neuroship/inframate"
            url "${TARBALL_URL}"
            sha256 "${TARBALL_SHA}"
            license "AGPL-3.0-only"

            depends_on "python@3.13"

            skip_clean "libexec"

          $(sed 's/^/  /' /tmp/resources.txt)

            def install
              virtualenv_create(libexec, "python3.13")
              # Install Rust-based packages as pre-built wheels from PyPI
              system libexec/"bin/pip", "install", "-v", "--no-deps", "--ignore-installed",
                     ${RUST_PINS_RB}
              # Install pure/C-extension packages from source resources
              resources.each do |r|
                r.stage do
                  system libexec/"bin/pip", "install", "-v", "--no-deps", "--no-binary", ":all:",
                         "--ignore-installed", "."
                end
              end
              system libexec/"bin/pip", "install", "-v", "--no-deps", "--no-binary", ":all:",
                     "--ignore-installed", "."
              bin.install_symlink libexec/"bin/inframate"
            end

            test do
              assert_match "inframate", shell_output("#{bin}/inframate --help")
            end
          end
          ENDFORMULA

      - name: Push to tap
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/inframate.rb
          git commit -m "inframate ${{ steps.meta.outputs.version }}"
          git push
